<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">压缩包工具解压主界面规划示意</title>
  <desc id="desc">左侧解压、密码库与设置导航，中央压缩包任务列表，右侧输出目录、密码复用与同名文件策略。使用虚构数据。</desc>
  <defs>
    <style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1F2937} .secondary{fill:#4B5563} .small{font-size:13px} .body{font-size:14px} .heading{font-size:16px;font-weight:600} .white{fill:#FFFFFF} .blue{fill:#1D4ED8} .green{fill:#15803D} .line{stroke:#E5E7EB;stroke-width:1} .icon{stroke:#4B5563;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1120" height="760" fill="#F3F4F6"/>
  <rect width="1120" height="44" fill="#FFFFFF"/>

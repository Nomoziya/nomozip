<style>body{margin:24px;background:#f3f5f8;color:#18202a;font:15px/1.65 "Segoe UI","Microsoft YaHei UI",sans-serif}h1{font-size:24px;margin:0}p{max-width:1050px}select{padding:8px;margin:0 16px 16px 4px}label{display:inline-block}img{display:block;max-width:100%;height:auto;border:1px solid #c4cbd5}a{color:#0066c9}small{display:block;max-width:1050px}</style>
<h1>nomozip P2：浏览偏好与每项分别压缩</h1><p>浏览视图、排序和列宽可恢复或重置；分别压缩自动命名，重名编号保留已有文件，一批共用一次密码提示。默认仍合并压缩。以下均为双架构隔离 CI 的实际 WPF 原图，使用合成资料。</p>
<p><a href="provenance.json">原始报告、逐文件摘要与候选核对</a> · <a href="../usability-20261021/product.html">上一批布局与原始证据</a> · <a href="https://github.com/Nomoziya/nomozip/actions/runs/39597672009">x64 CI</a> · <a href="https://github.com/Nomoziya/nomozip/actions/runs/39597753718">ARM64 CI</a></p>
<label>架构<select id="arch"><option>x64</option><option>arm64</option></select></label><label>语言<select id="lang"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><label>页面<select id="scene"><option value="separate">分别压缩设置</option><option value="customized">已记忆的浏览视图</option><option value="reset">重置浏览布局</option><option value="results">分别压缩任务结果</option><option value="tasks">任务与详情</option><option value="compression">压缩方案与摘要</option><option value="filters">浏览筛选</option><option value="10000">一万条目列表</option><option value="100000">十万条目列表</option></select></label><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="contrast">模拟高对比</option></select></label><label>宽度<select id="width"><option>1152</option><option>800</option></select></label>
<img id="capture" alt="隔离 CI 实际 WPF 截图"><p id="path"></p><small>浏览自定义与重置图为浅色 1152；任务结果图为模拟高对比 800。性能仍以原报告的实际界面数据为准。物理混合 DPI、多屏、真实系统高对比切换和交互式读屏待设备验收。本轮候选尚未合并或发布。</small>
<script>const get=id=>document.getElementById(id);function show(){const scene=get('scene').value;const fixed=['customized','reset','results','10000','100000'].includes(scene);if(fixed){get('theme').value=scene==='results'?'contrast':'light';get('width').value=scene==='results'?'800':'1152'}get('theme').disabled=fixed;get('width').disabled=fixed;const arch=get('arch').value,lang=get('lang').value,theme=get('theme').value,width=get('width').value;const name=scene==='separate'?`p2-separate-${theme}-${width}`:scene==='customized'?'p2-browser-customized':scene==='reset'?'p2-browser-reset':scene==='results'?'p2-separate-results':['10000','100000'].includes(scene)?`large-list-${scene}`:`${scene==='filters'?'filters':'usability-'+scene}-${theme}-${width}`;const path=`flows/${arch}/${lang}/${name}.png`;get('capture').src=path;get('path').textContent=path}document.querySelectorAll('select').forEach(e=>e.onchange=show);show();</script></html>

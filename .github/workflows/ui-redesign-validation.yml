name: UI redesign targeted validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redesign:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        if: matrix.architecture == 'x64'
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Prepare native tools and build the shared-runtime candidate
        env:
          TASK_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = 'C:\Program Files\7-Zip;' + $env:PATH
          if ('${{ matrix.architecture }}' -eq 'x64') { $env:PATH = (Join-Path $env:TASK_MSYS2_LOCATION 'ucrt64/bin') + ';' + $env:PATH }
          ./scripts/bootstrap.ps1 -Architecture '${{ matrix.architecture }}'
          ./scripts/build-worker.ps1 -Architecture '${{ matrix.architecture }}'
          ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -Configuration Release -SkipWorker
      - name: Validate redesigned pages and actual archive operations in both languages
        run: |
          foreach ($taskLanguage in @('zh-CN','en')) {
            $taskProcess = Start-Process ./artifacts/app/ArchivePassword.exe -ArgumentList @('--validate-redesign',$PWD.Path,$taskLanguage) -WindowStyle Hidden -Wait -PassThru
            if ($taskProcess.ExitCode -ne 0) { throw "Redesign validation failed: $taskLanguage" }
            $taskReport = Get-Content "artifacts/ui-redesign/$taskLanguage/report.json" -Raw | ConvertFrom-Json
            if (-not $taskReport.passed) { throw "Redesign report failed: $taskLanguage" }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-redesign-${{ matrix.architecture }}
          path: artifacts/ui-redesign/**/*
          if-no-files-found: error

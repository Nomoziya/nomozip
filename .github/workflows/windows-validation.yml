name: Windows validation and upstream engine check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validate_shell_identity:
        description: 'Optional prototype audit on the disposable VM; outside product acceptance'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  vault-export:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare SDK and synthetic vault export
        run: |
          $env:PATH = 'C:\Program Files\7-Zip;' + $env:PATH
          ./scripts/bootstrap.ps1
          $env:DOTNET_CLI_HOME = Join-Path $PWD '.tools/dotnet-home'
          & ./.tools/dotnet/dotnet.exe build tests/VaultTransferValidation/VaultTransferValidation.csproj --nologo -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Vault export fixture build failed.' }
          & ./.tools/dotnet/dotnet.exe tests/VaultTransferValidation/bin/Debug/net10.0-windows/VaultTransferValidation.dll $PWD.Path export (Join-Path $PWD 'artifacts/vault-cross-machine')
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic cross-machine export failed.' }
      - name: Transfer artificial encrypted fixtures to another Windows runner
        uses: actions/upload-artifact@v7
        with:
          name: vault-cross-machine-fixtures
          path: |
            artifacts/vault-cross-machine/synthetic.nvault
            artifacts/vault-cross-machine/source.apv
            artifacts/vault-cross-machine/source-identity.json
          retention-days: 7
  validate:
    needs: vault-export
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add native tools to the job path
        env:
          TASK_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:TASK_MSYS2_LOCATION 'ucrt64/bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\Program Files\7-Zip' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare official engines and local SDK
        run: ./scripts/bootstrap.ps1
      - name: Build worker and prepare integration fixtures
        run: |
          ./scripts/build-worker.ps1
          $env:DOTNET_CLI_HOME = Join-Path $PWD '.tools/dotnet-home'
          $env:NUGET_HTTP_CACHE_PATH = Join-Path $PWD '.tools/nuget-http'
          $env:NUGET_SCRATCH = Join-Path $PWD '.tools/nuget-scratch'
          & ./.tools/dotnet/dotnet.exe build tests/EngineSmoke/EngineSmoke.csproj --nologo -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Engine client build failed.' }
          python tests/engine_validation.py
          if ($LASTEXITCODE -ne 0) { throw 'Baseline engine validation failed.' }
      - name: Validate a new official stable engine when available
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./scripts/follow-official-engine.ps1 -Update
      - name: Build desktop preview
        run: ./scripts/build.ps1 -Configuration Release -SkipWorker
      - name: Validate vault, updates and desktop command flows
        run: |
          ./scripts/test.ps1 -SkipEngineValidation
          & ./.tools/dotnet/dotnet.exe tests/AssociationValidation/bin/Debug/net10.0-windows/AssociationValidation.dll $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'File association validation failed.' }
      - name: Validate origin preservation on an isolated exFAT virtual disk
        run: ./scripts/test-origin-fat.ps1
      - name: Verify actual Windows Shell menu enumeration and invocation
        run: ./scripts/test-shell-live.ps1
      - name: Validate signed sparse identity on the disposable runner
        if: github.event_name == 'workflow_dispatch' && inputs.validate_shell_identity
        # Test certificate trust is never installed on a developer/user machine.
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-shell-identity.ps1
      - name: Obtain synthetic backup from independent Windows machine
        uses: actions/download-artifact@v8
        with:
          name: vault-cross-machine-fixtures
          path: artifacts/vault-cross-machine
      - name: Verify portable backup migration as an independent Windows user
        run: ./scripts/test-vault-independent-user.ps1
      - name: Validate lightweight installer and legacy bundled-runtime upgrade
        run: |
          ./scripts/bootstrap-installer.ps1
          # Bundled runtime is an isolated old-install fixture, never a release.
          ./scripts/build.ps1 -Configuration Release -SkipWorker -SelfContained -OutputDirectory artifacts/self-contained-app
          ./scripts/build.ps1 -Configuration Release -SkipWorker -OutputDirectory artifacts/light-app
          ./scripts/test-installer.ps1
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            artifacts/*validation.json
            artifacts/accessibility-preview/*.png
            artifacts/vault-transfer-preview/*.png
            artifacts/password-organization-preview/*.png
            artifacts/file-hash-preview/*.png
            artifacts/encoding-preview/*.png
            artifacts/dpi-preview/*.png
            artifacts/queue-preview/*.png
            artifacts/concurrency-preview/*.png
            artifacts/pause-preview/*.png
            artifacts/notification-preview/*.png
            artifacts/shell-validation/**/*.log
            artifacts/origin-fat/**/*.log
            artifacts/origin-fat/**/disk-identity.json
            artifacts/shell-identity/**/*.log
            artifacts/shell-identity/**/build.json
          if-no-files-found: ignore
      # This workflow does not publish or sign production updates.

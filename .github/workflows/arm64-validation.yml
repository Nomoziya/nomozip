name: Native Windows ARM64 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native official engines and SDK
        run: |
          $env:PATH = 'C:\Program Files\7-Zip;' + $env:PATH
          ./scripts/bootstrap.ps1 -Architecture arm64
      - name: Native ARM64 worker
        run: ./scripts/build-worker.ps1 -Architecture arm64
      - name: Native lightweight desktop build
        id: native_build
        run: ./scripts/build.ps1 -Architecture arm64 -Configuration Release -SkipWorker
      - name: Native visual and row input regressions before the full suite
        run: ./scripts/test-visual-refresh.ps1
      - name: Current product UI and actual flows in both languages
        if: always() && steps.native_build.outcome == 'success'
        run: ./scripts/test-redesign-ui.ps1
      - name: Native data desktop updates and x64 vault migration
        if: always() && steps.native_build.outcome == 'success'
        run: ./scripts/test-arm64.ps1
      - name: Native traditional Shell selection and Explorer menu
        if: always() && steps.native_build.outcome == 'success'
        run: |
          ./scripts/test-shell.ps1 -Architecture arm64
          ./scripts/test-shell-live.ps1 -Architecture arm64
      - name: Native origin behavior on disposable exFAT virtual disk
        if: always() && steps.native_build.outcome == 'success'
        run: ./scripts/test-origin-fat.ps1
      - name: Native engine maintenance with isolated test keys and offline GitHub
        if: always() && steps.native_build.outcome == 'success'
        run: |
          python tests/engine_release_validation.py --architecture arm64
          if ($LASTEXITCODE -ne 0) { throw 'Native thirteen-matrix maintenance acceptance failed.' }
      - name: Native lightweight install upgrade extraction and uninstall
        if: always() && steps.native_build.outcome == 'success'
        run: |
          ./scripts/bootstrap-installer.ps1 -Architecture arm64
          ./scripts/build.ps1 -Architecture arm64 -Configuration Release -SkipWorker -OutputDirectory artifacts/light-app
          $taskOldRelease=Invoke-RestMethod 'https://api.github.com/repos/Nomoziya/nomozip/releases/tags/v0.1.0'
          $taskOldAsset=$taskOldRelease.assets | Where-Object name -eq 'nomozip-0.1.0-light-win-x64.zip'
          if ($taskOldAsset.digest -ne 'sha256:cfdf864d3eb62822e591412227d3f9b5048dac9e1bf1ca6ca73d2204595638d4') { throw 'Immutable old lightweight fixture digest changed.' }
          Invoke-WebRequest $taskOldAsset.browser_download_url -OutFile artifacts/previous-x64-light.zip
          if ((Get-FileHash artifacts/previous-x64-light.zip).Hash.ToLowerInvariant() -ne $taskOldAsset.digest.Substring(7)) { throw 'Old lightweight fixture download changed.' }
          Expand-Archive -LiteralPath artifacts/previous-x64-light.zip -DestinationPath artifacts/previous-x64-light
          ./scripts/test-installer.ps1 -Architecture arm64 -PreviousArchitecture x64 -PreviousApplicationDirectory "$PWD/artifacts/previous-x64-light"
      - name: Restore canonical source metadata and package native local candidate
        run: |
          git restore --worktree -- engines
          ./scripts/build-release.ps1 -Architecture arm64 -ApplicationDirectory artifacts/light-app -OutputDirectory artifacts/release-0.3.0-arm64 -Python python
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64-lightweight-candidate
          path: artifacts/release-0.3.0-arm64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-validation-reports
          path: |
            artifacts/*validation.json
            artifacts/arm64-workspace/artifacts/*validation.json
            artifacts/worker/ArchiveEngineWorker.exe
            artifacts/er-*/command-*.log
            artifacts/er-*/s/artifacts/c/candidate-review.json
            artifacts/er-*/s/artifacts/c/logs/*.log
            artifacts/er-*/s/artifacts/c/workspace/artifacts/*validation.json
            artifacts/visual-refresh/**/*
            artifacts/ui-redesign/**/*
            artifacts/*-preview/*.png
          if-no-files-found: ignore

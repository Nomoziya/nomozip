name: Native Windows ARM64 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native official engines and SDK
        run: |
          $env:PATH = 'C:\Program Files\7-Zip;' + $env:PATH
          ./scripts/bootstrap.ps1 -Architecture arm64
      - name: Native ARM64 worker
        run: ./scripts/build-worker.ps1 -Architecture arm64
      - name: Native lightweight desktop build
        run: ./scripts/build.ps1 -Architecture arm64 -Configuration Release -SkipWorker
      - name: Native data desktop updates and x64 vault migration
        run: ./scripts/test-arm64.ps1
      - name: Native engine maintenance with isolated test keys and offline GitHub
        run: |
          python tests/engine_release_validation.py --architecture arm64
          if ($LASTEXITCODE -ne 0) { throw 'Native ten-matrix maintenance acceptance failed.' }
      - name: Native lightweight install upgrade extraction and uninstall
        run: |
          ./scripts/bootstrap-installer.ps1 -Architecture arm64
          ./scripts/build.ps1 -Architecture arm64 -Configuration Release -SkipWorker -OutputDirectory artifacts/light-app
          ./scripts/test-installer.ps1 -Architecture arm64
      - name: Restore canonical source metadata and package native local candidate
        run: |
          git restore --worktree -- engines
          ./scripts/build-release.ps1 -Architecture arm64 -ApplicationDirectory artifacts/light-app -OutputDirectory artifacts/release-0.2.0-preview.20-arm64 -Python python
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64-lightweight-candidate
          path: artifacts/release-0.2.0-preview.20-arm64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-validation-reports
          path: |
            artifacts/*validation.json
            artifacts/arm64-workspace/artifacts/*validation.json
            artifacts/worker/ArchiveEngineWorker.exe
          if-no-files-found: ignore

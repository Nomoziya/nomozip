name: Desktop UI and lightweight package validation
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Standalone design prototype or existing full product validation'
        type: choice
        default: prototype
        options: [prototype, pages, product, followup]
      architecture:
        description: 'Native product architecture (standalone prototypes remain x64)'
        type: choice
        default: x64
        options: [x64, arm64]
      legacy_visual:
        description: 'Also validate row input and visual regressions against current layout'
        type: boolean
        default: false
      release_followup:
        description: 'Affected functional flows, actual 0.2.1 upgrade and final release packaging'
        type: boolean
        default: false
      followup_flags:
        description: 'Optional comma-separated desktop cases for targeted follow-up; empty runs all'
        type: string
        default: ''
      followup_languages:
        description: 'Include actual localization and theme restart checks'
        type: boolean
        default: true
      reproduce_button_hover:
        description: 'Prove the old 0.3.0 hover occlusion with real input before validating the fix'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prototype:
    if: github.event.inputs.scope != 'product' && github.event.inputs.scope != 'followup'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build independent shared-runtime prototype
        run: dotnet publish prototypes/UiReference/UiReference.csproj -c Release -o artifacts/ui-reference-prototype/app --no-self-contained --nologo -m:1 -nr:false
      - name: Capture running WPF prototype using generated archive only
        if: github.event.inputs.scope != 'pages'
        run: |
          $taskOutput = Join-Path $PWD 'artifacts/ui-reference-prototype/evidence'
          $taskProcess = Start-Process ./artifacts/ui-reference-prototype/app/nomozip-reference-preview.exe -ArgumentList @('--capture', $taskOutput) -WindowStyle Hidden -Wait -PassThru
          if ($taskProcess.ExitCode -ne 0) { throw 'Core visual prototype validation failed.' }
          $taskReport = Get-Content (Join-Path $taskOutput 'report.json') -Raw | ConvertFrom-Json
          if (-not $taskReport.passed) { throw 'Core visual prototype report failed.' }
      - name: Capture expanded design pages and form states
        run: |
          $taskOutput = Join-Path $PWD 'artifacts/ui-reference-prototype/evidence/pages'
          $taskProcess = Start-Process ./artifacts/ui-reference-prototype/app/nomozip-reference-preview.exe -ArgumentList @('--capture-pages', $taskOutput) -WindowStyle Hidden -Wait -PassThru
          if ($taskProcess.ExitCode -ne 0) { throw 'Expanded design page validation failed.' }
          $taskReport = Get-Content (Join-Path $taskOutput 'report.json') -Raw | ConvertFrom-Json
          if (-not $taskReport.passed) { throw 'Expanded design page report failed.' }
      - name: Package exact expanded prototype bytes
        run: Compress-Archive -Path artifacts/ui-reference-prototype/app/* -DestinationPath artifacts/nomozip-ui-reference-prototype-x64.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-reference-core-prototype
          path: |
            artifacts/ui-reference-prototype/evidence/**/*
            artifacts/nomozip-ui-reference-prototype-x64.zip
          if-no-files-found: error
  ui:
    if: github.event.inputs.scope == 'product' || github.event.inputs.scope == 'followup'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ${{ inputs.architecture || 'x64' }}
            runner: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        if: matrix.architecture == 'x64'
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Set native tools path
        env:
          TASK_MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if ('${{ matrix.architecture }}' -eq 'x64') {
            (Join-Path $env:TASK_MSYS2_LOCATION 'ucrt64/bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          'C:\Program Files\7-Zip' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare official engines and native SDK
        run: ./scripts/bootstrap.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Build native worker and lightweight application
        id: desktop_build
        run: |
          ./scripts/build-worker.ps1 -Architecture '${{ matrix.architecture }}'
          ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -Configuration Release -SkipWorker
      - name: Validate task controls, encrypted backup history and safe cache cleanup
        run: |
          & ./.tools/dotnet/dotnet.exe build tests/TaskImprovementsValidation -c Release --nologo -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Task improvements validation build failed.' }
          & ./.tools/dotnet/dotnet.exe tests/TaskImprovementsValidation/bin/Release/net10.0-windows/TaskImprovementsValidation.dll $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'Task improvements core validation failed.' }
      - name: Validate update feedback, source rules and large collection performance
        run: |
          foreach ($taskCase in @('PostReleaseValidation','BrowserPerformanceValidation','ApplicationUpdateValidation')) {
            & ./.tools/dotnet/dotnet.exe build "tests/$taskCase" -c Release --nologo -m:1 -nr:false
            if ($LASTEXITCODE -ne 0) { throw "$taskCase build failed." }
            $taskArguments = @("tests/$taskCase/bin/Release/net10.0-windows/$taskCase.dll", $PWD.Path)
            if ($taskCase -eq 'BrowserPerformanceValidation') { $taskArguments[1] = (Join-Path $PWD 'artifacts/post032-performance.json') }
            & ./.tools/dotnet/dotnet.exe @taskArguments
            if ($LASTEXITCODE -ne 0) { throw "$taskCase failed." }
          }
      - name: Validate native ARM64 architecture and cross-architecture synthetic vaults
        if: matrix.architecture == 'arm64'
        run: ./scripts/test-ui-arm64-architecture.ps1
      - name: Reproduce the released hover occlusion on the isolated desktop
        if: inputs.reproduce_button_hover && matrix.architecture == 'x64'
        run: |
          Copy-Item src/Desktop/App.xaml artifacts/button-fixed.xaml
          try {
            git fetch --no-tags origin tag v0.3.0
            if ($LASTEXITCODE -ne 0) { throw 'Released style baseline fetch failed.' }
            $taskOriginal = git show v0.3.0:src/Desktop/App.xaml
            if ($LASTEXITCODE -ne 0) { throw 'Released style baseline read failed.' }
            [IO.File]::WriteAllText((Join-Path $PWD 'src/Desktop/App.xaml'), ($taskOriginal -join "`n"), [Text.UTF8Encoding]::new($false))
            ./scripts/build.ps1 -Architecture x64 -Configuration Release -SkipWorker -OutputDirectory artifacts/button-before-app
            $taskProcess = Start-Process ./artifacts/button-before-app/ArchivePassword.exe -ArgumentList @('--validate-redesign',$PWD.Path,'zh-CN','--button-states-only') -WindowStyle Hidden -Wait -PassThru
            $taskReport = Get-Content artifacts/ui-redesign/zh-CN/report.json -Raw | ConvertFrom-Json
            if ($taskProcess.ExitCode -eq 0 -or $taskReport.passed -or $taskReport.error -or
                -not $taskReport.checks.'light/hash-import/normal rendered foreground glyphs remain visible' -or
                -not $taskReport.checks.'light/hash-import actual mouse hover reached action' -or
                $taskReport.checks.'light/hash-import/hover rendered foreground glyphs remain visible' -ne $false) {
              throw 'The original hover occlusion was not reproduced by real mouse input and rendered glyph checks.'
            }
          } finally {
            if (Test-Path artifacts/ui-redesign) { Copy-Item -LiteralPath artifacts/ui-redesign -Destination artifacts/button-before-0.3.0 -Recurse }
            Copy-Item artifacts/button-fixed.xaml src/Desktop/App.xaml -Force
          }
      - uses: actions/upload-artifact@v7
        if: always() && inputs.reproduce_button_hover && matrix.architecture == 'x64'
        with:
          name: released-0.3.0-button-state-reproduction
          path: artifacts/button-before-0.3.0/**/*
          if-no-files-found: error
      - name: Validate button rendering with explicit input provenance
        if: inputs.scope != 'followup'
        run: |
          # ARM window activation/input can be unavailable (runner-images#14049/#14069).
          # Keep native WPF rendering distinct from actual x64 mouse evidence.
          if ('${{ matrix.architecture }}' -eq 'arm64') { $env:NOMOZIP_BUTTON_INPUT='wpf-render-states' }
          New-Item -ItemType Directory -Force artifacts/button-states | Out-Null
          $taskFailed = $false
          foreach ($taskLanguage in @('zh-CN','en')) {
            $taskProcess = Start-Process ./artifacts/app/ArchivePassword.exe -ArgumentList @('--validate-redesign',$PWD.Path,$taskLanguage,'--button-states-only') -WindowStyle Hidden -Wait -PassThru
            Copy-Item -LiteralPath "artifacts/ui-redesign/$taskLanguage" -Destination "artifacts/button-states/$taskLanguage" -Recurse
            $taskReport = Get-Content "artifacts/button-states/$taskLanguage/report.json" -Raw | ConvertFrom-Json
            Write-Host "$taskLanguage button state checks: $($taskReport.checks.PSObject.Properties.Count)"
            $taskReport.checks.PSObject.Properties | Where-Object { -not $_.Value } | ForEach-Object { Write-Warning "Failed check: $($_.Name)" }
            if ($taskReport.error) { Write-Warning $taskReport.error }
            if ($taskProcess.ExitCode -ne 0 -or -not $taskReport.passed) { $taskFailed = $true }
          }
          if ($taskFailed) { throw 'Actual button input or rendered glyph validation failed.' }
      - uses: actions/upload-artifact@v7
        if: always() && inputs.scope != 'followup'
        with:
          name: actual-button-states-${{ matrix.architecture }}
          path: artifacts/button-states/**/*
          if-no-files-found: error
      - name: Validate redesigned pages and actual archive operations in both languages
        if: inputs.scope != 'followup'
        run: |
          $taskProductFailed = $false
          foreach ($taskLanguage in @('zh-CN','en')) {
            $taskProcess = Start-Process ./artifacts/app/ArchivePassword.exe -ArgumentList @('--validate-redesign',$PWD.Path,$taskLanguage) -WindowStyle Hidden -Wait -PassThru
            if ($taskProcess.ExitCode -ne 0) { $taskProductFailed = $true; Write-Warning "Redesign validation failed: $taskLanguage" }
            $taskReport = Get-Content "artifacts/ui-redesign/$taskLanguage/report.json" -Raw | ConvertFrom-Json
            if (-not $taskReport.passed) { $taskProductFailed = $true; Write-Warning "Redesign report failed: $taskLanguage" }
            Write-Host "$taskLanguage product checks: $($taskReport.checks.PSObject.Properties.Count)"
            $taskReport.checks.PSObject.Properties | Where-Object { -not $_.Value } | ForEach-Object { Write-Warning "Failed check: $($_.Name)" }
            if ($taskReport.error) { Write-Warning ($taskReport.error | ConvertTo-Json -Depth 5 -Compress) }
          }
          if ($taskProductFailed) { throw 'One or more product language validations failed.' }
      - name: Target row input and current visual regression checks
        if: inputs.legacy_visual
        run: ./scripts/test-visual-refresh.ps1
      - name: Follow up primary desktop commands with synthetic data
        id: followup_prepare
        if: ${{ !cancelled() && inputs.release_followup && steps.desktop_build.outcome == 'success' }}
        run: ./scripts/test-desktop-release-followup.ps1 -Architecture '${{ matrix.architecture }}' -Flags validate -SkipLanguages
      - uses: actions/upload-artifact@v7
        if: always() && inputs.release_followup
        with:
          name: release-followup-${{ matrix.architecture }}-primary-reports
          path: |
            artifacts/*validation.json
            artifacts/accessibility-preview/*.png
            artifacts/ui-redesign/*/report.json
            artifacts/ui-redesign/*/actual-compression-compact-partial-selection.png
          if-no-files-found: ignore
      - name: Validate upstream official downloads and existing signed engine packages
        if: ${{ !cancelled() && inputs.release_followup && contains(inputs.followup_flags, 'validate-official-engine') && steps.followup_prepare.outputs.prepared == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          foreach ($taskCase in @('OfficialEngineValidation','UpdateValidation')) {
            & ./.tools/dotnet/dotnet.exe build "tests/$taskCase" -c Release --nologo -m:1 -nr:false
            if ($LASTEXITCODE -ne 0) { throw "$taskCase build failed." }
            $taskArguments = @("tests/$taskCase/bin/Release/net10.0-windows/$taskCase.dll", $PWD.Path)
            if ($taskCase -eq 'OfficialEngineValidation') { $taskArguments += '--integration' }
            & ./.tools/dotnet/dotnet.exe @taskArguments
            if ($LASTEXITCODE -ne 0) { throw "$taskCase failed." }
          }
      - name: Follow up remaining affected flows and language settings
        if: ${{ !cancelled() && inputs.release_followup && steps.followup_prepare.outputs.prepared == 'true' }}
        env:
          TASK_FOLLOWUP_FLAGS: ${{ inputs.followup_flags }}
        run: |
          $taskFlags=@('validate-vault-transfer','validate-password-organization','validate-file-hashes','validate-shell-ui','validate-application-updates','validate-extraction-tools','validate-selection','validate-encoding','validate-origin','validate-dpi','validate-queue','validate-concurrency','validate-pause','validate-notifications','validate-sfx','validate-formats','validate-volumes','validate-checkpoints','validate-drag-out','validate-content-preview','validate-conversion','validate-archive-editing','validate-master-vault')
          if($env:TASK_FOLLOWUP_FLAGS){$taskFlags=$env:TASK_FOLLOWUP_FLAGS.Split(',',[StringSplitOptions]::RemoveEmptyEntries)}
          ./scripts/test-desktop-release-followup.ps1 -Architecture '${{ matrix.architecture }}' -SkipPrepare -Flags $taskFlags -SkipLanguages:('${{ inputs.followup_languages }}' -ne 'true')
      - name: Validate vault compatibility, protection and localized resources
        if: ${{ !cancelled() && inputs.release_followup && steps.followup_prepare.outputs.prepared == 'true' }}
        run: |
          foreach ($taskCase in @('PasswordOrganizationValidation','VaultTransferValidation','MasterVaultValidation','LocalizationValidation')) {
            & ./.tools/dotnet/dotnet.exe build "tests/$taskCase" -c Release --nologo -m:1 -nr:false
            if ($LASTEXITCODE -ne 0) { throw "$taskCase build failed." }
            & ./.tools/dotnet/dotnet.exe "tests/$taskCase/bin/Release/net10.0-windows/$taskCase.dll" $PWD.Path
            if ($LASTEXITCODE -ne 0) { throw "$taskCase failed." }
          }
      - uses: actions/upload-artifact@v7
        if: always() && inputs.release_followup
        with:
          name: release-followup-${{ matrix.architecture }}-reports
          path: |
            artifacts/*validation.json
            artifacts/*-preview/*.png
            artifacts/task-improvements-preview/**/*.png
            artifacts/official-engine-preview/**/*.png
            artifacts/post032-preview/**/*.png
            artifacts/post032-performance.json
          if-no-files-found: ignore
      - name: Validate installer success receipt and first-start cache cleanup
        if: ${{ !cancelled() && inputs.release_followup && contains(inputs.followup_flags, 'validate-post032') && steps.followup_prepare.outputs.prepared == 'true' }}
        run: |
          ./scripts/bootstrap-installer.ps1 -Architecture '${{ matrix.architecture }}'
          Copy-Item artifacts/app artifacts/light-app -Recurse
          ./scripts/test-installer.ps1 -Architecture '${{ matrix.architecture }}' -PreviousArchitecture '${{ matrix.architecture }}' -PreviousApplicationDirectory (Join-Path $PWD 'artifacts/app') -PreviousFrameworkDependent
      - name: Upgrade the published 0.2.1 lightweight installation and package release
        if: inputs.release_followup && inputs.followup_flags == ''
        run: |
          ./scripts/bootstrap-installer.ps1 -Architecture '${{ matrix.architecture }}'
          ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -Configuration Release -SkipWorker -OutputDirectory artifacts/light-app
          ./scripts/test-stable-upgrade.ps1 -Architecture '${{ matrix.architecture }}'
          git restore --worktree -- engines
          ./scripts/build-release.ps1 -Architecture '${{ matrix.architecture }}' -ApplicationDirectory artifacts/light-app -OutputDirectory 'artifacts/release-0.3.0-${{ matrix.architecture }}' -Python python
      - uses: actions/upload-artifact@v7
        if: inputs.release_followup && inputs.followup_flags == ''
        with:
          name: release-followup-${{ matrix.architecture }}-package
          path: artifacts/release-0.3.0-${{ matrix.architecture }}/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && inputs.release_followup
        with:
          name: release-followup-${{ matrix.architecture }}-package-review
          path: |
            artifacts/installer-0.2.1-upgrade-validation.json
            artifacts/light-installer-validation.json
            artifacts/release-0.3.0-${{ matrix.architecture }}-validation.json
          if-no-files-found: ignore
      - name: Package the exact tested shared-runtime candidate
        run: |
          Compress-Archive -Path artifacts/app/* -DestinationPath 'artifacts/nomozip-ui-redesign-${{ matrix.architecture }}.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.architecture }}-lightweight-candidate
          path: artifacts/nomozip-ui-redesign-${{ matrix.architecture }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && inputs.scope != 'followup'
        with:
          name: ui-${{ matrix.architecture }}-validation-reports
          path: |
            artifacts/ui-redesign/**/*
            artifacts/visual-refresh/**/*
            artifacts/arm64-ui-native-workspace/artifacts/*validation.json
          if-no-files-found: error
